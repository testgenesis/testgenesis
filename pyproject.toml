[project]
name = "testgenesis"
dynamic = ["version"]
description = "TestGenesis - Generate E2E tests from user analytics data"
authors = [
    { name = "TestGenesis Team" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "types-click",
    "rich>=13.0.0",
    "amplitude-analytics>=1.1.0",
    "requests>=2.32.3",
    "pyyaml>=6.0.2",
]
optional-dependencies = {dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]}

[project.scripts]
testgenesis = "testgenesis_cli.cli:cli"

[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release" }

[tool.hatch.build]
packages = ["packages/cli/testgenesis_cli", "packages/dsl/testgenesis_dsl"]
include = [
    "packages/*/py.typed",
]

[tool.hatch.metadata]
allow-direct-references = true
package-dir = "packages/cli"

[tool.hatch.envs.test]
dependencies = [
    "pytest>=8.3.5",
    "pytest-cov>=4.1.0",
    "pytest-watch>=4.2.0",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args}"
watch = "ptw {args}"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
mypy_path = ["packages/cli", "packages/dsl"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["amplitude.*"]
ignore_missing_imports = true

[tool.ruff]
# Enable ruff formatter
include = ["*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["testgenesis_dsl", "testgenesis_cli"]

[dependency-groups]
dev = [
    "hypothesis>=6.130.5",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-watch>=4.2.0",
    "ruff>=0.11.0",
]
