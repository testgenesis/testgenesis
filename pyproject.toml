[project]
name = "testgenesis"
dynamic = ["version"]
description = "TestGenesis - Generate E2E tests from user analytics data"
authors = [
    { name = "TestGenesis Team" }
]
requires-python = ">=3.8"
dependencies = []
optional-dependencies = {dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]}

[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release" }

[tool.hatch.build]
packages = [
    "packages/dsl",
    "packages/cli"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
# Enable ruff formatter
include = ["*.py"]
line-length = 100
target-version = "py38"

# Enable rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]

# Configure isort rules
[tool.ruff.isort]
known-first-party = ["testgenesis_dsl", "testgenesis_cli"] 