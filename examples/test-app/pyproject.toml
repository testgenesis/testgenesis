[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-app"
version = "0.1.0"
description = "Test application for TestGenesis"
requires-python = ">=3.8"
dependencies = [
    "nicegui",
    "python-dotenv",
    "pytest",
    "pytest-watch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["."] 

[dependency-groups]
dev = [
    "pytest-watch>=4.2.0",
]
