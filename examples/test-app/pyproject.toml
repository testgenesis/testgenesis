[project]
name = "testgenesis-test-app"
version = "0.1.0"
description = "A simple NiceGUI application with Amplitude tracking"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=1.4.12",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."] 
