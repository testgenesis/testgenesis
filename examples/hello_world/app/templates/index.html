<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-4">Hello World App</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="mb-4">
                <label for="name" class="block text-gray-700 mb-2">Enter your name:</label>
                <input type="text" id="name" class="border rounded px-3 py-2 w-full">
            </div>
            
            <button onclick="greet()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Greet Me!
            </button>
            
            <div id="result" class="mt-4 text-lg"></div>
        </div>
    </div>

    <script>
        async function greet() {
            const name = document.getElementById('name').value || 'World';
            const response = await fetch(`/api/greet/${name}`);
            const data = await response.json();
            document.getElementById('result').textContent = data.message;
        }
    </script>
</body>
</html>
