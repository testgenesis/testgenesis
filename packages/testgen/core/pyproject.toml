[project]
name = "testgenesis-core"
version = "0.1.0"
description = "TestGenesis Core - Open Source Test Generation Engine"
authors = [{ name = "TestGenesis Team" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.18.0",
    "playwright>=1.42.0",
    "pytest>=8.0.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 