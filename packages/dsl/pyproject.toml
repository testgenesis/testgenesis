[project]
name = "testgenesis-dsl"
version = "0.1.0"
description = "TestGenesis DSL for test flow definition and code generation"
authors = [{ name = "TestGenesis Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py38" 