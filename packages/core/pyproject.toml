[project]
name = "testgenesis"
version = "0.1.0"
description = "AI-powered test suite optimization"
authors = [{ name = "TestGenesis Team" }]
dependencies = [
    "amplitude-analytics>=1.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.2.0",
]

[project.scripts]
testgenesis = "testgenesis.cli.analytics:analytics"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py38" 